name: Analyze
description: Upload test results to SonarCloud and coverage to Qlty

inputs:
  sonar-token:
    description: SonarCloud token
    required: true
  qlty-coverage-token:
    description: Qlty coverage token
    required: true

runs:
  using: composite
  steps:
    - uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}

    - uses: qltysh/qlty-action/coverage@c9b09987143d1e4ac955f4803c7bea742102feb5 # v2.4.0
      with:
        token: ${{ inputs.qlty-coverage-token }}
        files: test-coverage.out
