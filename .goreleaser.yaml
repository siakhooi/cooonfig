# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/cooonfig/
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
      - android
    # android/amd64 and android/386 need cgo. arm64 cross-compiles with CGO_ENABLED=0.
    ignore:
      - goos: android
        goarch: amd64
      - goos: android
        goarch: "386"
    ldflags:
      - "-s"
      - "-w"
      - "-X main.Version={{.Version}}"
      - "-X main.Date={{.Date}}"
      - "-X main.Commit={{.Commit}}"

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of `uname`.
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - package_name: cooonfig
    file_name_template: "{{ .ConventionalFileName }}"
    vendor: siakhooi
    homepage: https://github.com/siakhooi/cooonfig
    maintainer: siakhooi
    description: "transform config files"
    license: MIT
    bindir: /usr/bin
    formats:
      - deb
      - rpm
  - id: termux
    package_name: cooonfig
    file_name_template: '{{ trimsuffix .ConventionalFileName ".deb" }}.termux.deb'
    vendor: siakhooi
    homepage: https://github.com/siakhooi/cooonfig
    maintainer: siakhooi
    description: "transform config files"
    license: MIT
    bindir: /usr/bin
    formats:
      - termux.deb


changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
